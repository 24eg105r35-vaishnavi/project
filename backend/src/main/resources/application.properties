spring.application.name=Student Achievement Portal
server.port=${PORT:8085}

# Default DataSource: H2 in MySQL compatibility mode (persistent in ./data/portaldb)
# Allows zero-setup out of the box running for evaluator/faculty/students
spring.datasource.url=jdbc:h2:file:./data/portaldb;MODE=MySQL;DATABASE_TO_UPPER=FALSE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload configurations (Camera uploads and PDF proof files up to 25MB)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# File Vault storage location
app.upload.dir=./file-vault
app.portal.institution=Anurag University
app.portal.domain=@anurag.edu.in
