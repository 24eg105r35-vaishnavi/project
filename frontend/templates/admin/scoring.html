<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Scoring & Recognition Matrix')}"></head>
<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main class="main-content">
    <div class="container container-narrow">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div style="margin-bottom: 1.5rem;">
            <a th:href="@{/admin/dashboard}" style="font-size: 0.88rem; color: var(--slate-500); display: inline-flex; align-items: center; gap: 0.35rem;">
                ← Back to Admin Console
            </a>
            <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--slate-900); margin-top: 0.5rem;">
                Scoring and Recognition Matrix (Section 13)
            </h1>
            <p style="font-size: 0.88rem; color: var(--slate-600); margin-top: 0.25rem;">
                Points are awarded only on faculty approval, turning verified achievements into recognition signals.
            </p>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Level / Sub-Type</th>
                            <th>Description</th>
                            <th>Points Weight</th>
                            <th>Update</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="rule : ${rules}">
                            <td>
                                <span class="badge badge-category" th:text="${rule.categoryCode}">CAT</span>
                            </td>
                            <td>
                                <strong th:text="${rule.subType != null ? rule.subType : (rule.level != null ? rule.level.displayName : 'Standard')}">WINNER</strong>
                                <span th:if="${rule.level != null}" style="font-size: 0.75rem; color: var(--slate-500); display: block;" th:text="${rule.level.displayName}">Level</span>
                            </td>
                            <td style="font-size: 0.82rem; color: var(--slate-600);" th:text="${rule.description}">Rule description</td>
                            <td>
                                <form th:action="@{/admin/scoring/update}" method="post" style="display: flex; gap: 0.5rem; align-items: center;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input type="hidden" name="ruleId" th:value="${rule.id}"/>
                                    <input type="number" name="points" class="form-control" th:value="${rule.points}" style="width: 75px; padding: 0.35rem 0.5rem; font-weight: 700; text-align: center;" min="1" max="100" required>
                                    <button type="submit" class="btn btn-secondary btn-sm" style="padding: 0.35rem 0.6rem;">Save</button>
                                </form>
                            </td>
                            <td>
                                <strong style="color: #059669; font-size: 0.95rem;" th:text="${rule.points} + ' pts'">20 pts</strong>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
