<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main class="main-content">
    <div class="container container-narrow">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem;">
            <div>
                <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--slate-900);">Notification Center</h1>
                <p style="font-size: 0.88rem; color: var(--slate-600); margin-top: 0.25rem;">
                    Institutional updates on submissions, approvals, and faculty remarks.
                </p>
            </div>
            <form th:action="@{/notifications/mark-all-read}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-secondary btn-sm">Mark All as Read</button>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(notifications)}" class="card" style="text-align: center; padding: 3rem;">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔔</div>
            <h3 style="font-size: 1.15rem; font-weight: 700; color: var(--slate-700);">No notifications right now</h3>
            <p style="font-size: 0.85rem; color: var(--slate-500); margin-top: 0.25rem;">
                You're all caught up! New decisions and verification notices will arrive here.
            </p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.85rem;">
            <div th:each="n : ${notifications}" class="card"
                 th:styleappend="${!n.isRead ? 'border-left: 4px solid var(--primary-600); background: #fdfdfe;' : 'opacity: 0.85;'}">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; margin-bottom: 0.35rem;">
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <span th:if="${!n.isRead}" style="width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--primary-600);"></span>
                        <h3 style="font-size: 1rem; font-weight: 700; color: var(--slate-900);" th:text="${n.title}">Notification Title</h3>
                    </div>
                    <span style="font-size: 0.78rem; color: var(--slate-400);" th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy HH:mm')}">Time</span>
                </div>

                <p style="font-size: 0.88rem; color: var(--slate-600); line-height: 1.5; margin-bottom: 0.75rem;" th:text="${n.message}">
                    Message content...
                </p>

                <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--slate-100); padding-top: 0.5rem;">
                    <div>
                        <a th:if="${n.link != null && !n.link.isBlank()}" th:href="${n.link}" class="btn btn-secondary btn-sm" style="font-size: 0.75rem;">
                            View Details →
                        </a>
                    </div>
                    <form th:if="${!n.isRead}" th:action="@{'/notifications/' + ${n.id} + '/read'}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-secondary btn-sm" style="font-size: 0.75rem; padding: 0.2rem 0.5rem;">Mark Read</button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
