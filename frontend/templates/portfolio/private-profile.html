<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Private Portfolio')}"></head>
<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main class="main-content" style="display: flex; align-items: center; justify-content: center; min-height: 60vh;">
    <div class="card" style="max-width: 500px; text-align: center; padding: 3rem 2rem;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">🔒</div>
        <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--slate-900);">Portfolio Set to Private</h1>
        <p style="font-size: 0.92rem; color: var(--slate-600); margin: 0.75rem 0 1.5rem; line-height: 1.6;">
            The student <strong th:text="${student.user.fullName}">Demo Student</strong> (<span th:text="${student.rollNumber}">DEMO001</span>) has chosen to restrict public visibility for this portfolio.
        </p>
        <a th:href="@{/}" class="btn btn-primary">Return to Homepage</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
