<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profile & Privacy')}"></head>
<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main class="main-content">
    <div class="container container-narrow">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div style="margin-bottom: 1.5rem;">
            <a th:href="@{/student/dashboard}" style="font-size: 0.88rem; color: var(--slate-500); display: inline-flex; align-items: center; gap: 0.35rem;">
                ← Back to Dashboard
            </a>
            <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--slate-900); margin-top: 0.5rem;">
                Profile &amp; Portfolio Privacy Settings
            </h1>
            <p style="font-size: 0.88rem; color: var(--slate-600); margin-top: 0.25rem;">
                Manage your public portfolio URL and search engine visibility (Section 7.2 &amp; Section 10).
            </p>
        </div>

        <!-- Shareable Link Card -->
        <div class="card" style="background: var(--primary-50); border: 1.5px solid var(--primary-200); margin-bottom: 1.5rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;">
                <div>
                    <h3 style="font-size: 0.95rem; font-weight: 700; color: var(--primary-900);">Your Shareable Portfolio URL</h3>
                    <div style="font-family: var(--font-mono); font-size: 0.88rem; color: var(--primary-700); margin-top: 0.25rem;">
                        https://portal.anurag.edu.in/portfolio/<span th:text="${student.rollNumber}">DEMO001</span>
                    </div>
                </div>
                <a th:href="@{'/portfolio/' + ${student.rollNumber}}" target="_blank" class="btn btn-primary btn-sm">
                    Open Public View ↗
                </a>
            </div>
        </div>

        <div class="card">
            <form th:action="@{/student/profile}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" th:value="${student.user.fullName}" disabled style="background: var(--slate-100);">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Roll Number</label>
                        <input type="text" class="form-control" th:value="${student.rollNumber}" disabled style="background: var(--slate-100);">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="form-label">Department / Branch</label>
                        <input type="text" class="form-control" th:value="${student.branch}" disabled style="background: var(--slate-100);">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="currentSemester">Current Semester</label>
                        <input type="number" id="currentSemester" name="currentSemester" class="form-control" th:value="${student.currentSemester}" min="1" max="8">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="section">Section</label>
                    <input type="text" id="section" name="section" class="form-control" th:value="${student.section}" placeholder="e.g. R or A">
                </div>

                <div class="form-group">
                    <label class="form-label" for="bio">Professional Bio &amp; Research Interests</label>
                    <textarea id="bio" name="bio" class="form-control" rows="4" placeholder="Brief bio for your public verified portfolio..." th:text="${student.bio}"></textarea>
                </div>

                <!-- Visibility Selector -->
                <div class="form-group" style="background: var(--slate-50); padding: 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--slate-300);">
                    <label class="form-label" style="font-size: 0.95rem; font-weight: 700; color: var(--slate-900);">
                        🔒 Public Visibility &amp; SEO Gate (Section 7.2)
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.5rem;">
                        <label style="display: flex; align-items: flex-start; gap: 0.65rem; cursor: pointer;">
                            <input type="radio" name="profileVisibility" value="PUBLIC"
                                   th:checked="${student.profileVisibility.name() == 'PUBLIC'}" style="margin-top: 0.25rem;">
                            <div>
                                <strong style="color: var(--slate-800);">Public (Recommended)</strong>
                                <p style="font-size: 0.8rem; color: var(--slate-500); margin-top: 0.15rem;">
                                    Shareable link for resumes, recruiters, and indexable by search engines (JSON-LD credential tags included). Only verified achievements appear.
                                </p>
                            </div>
                        </label>

                        <label style="display: flex; align-items: flex-start; gap: 0.65rem; cursor: pointer;">
                            <input type="radio" name="profileVisibility" value="COLLEGE_ONLY"
                                   th:checked="${student.profileVisibility.name() == 'COLLEGE_ONLY'}" style="margin-top: 0.25rem;">
                            <div>
                                <strong style="color: var(--slate-800);">College Network Only</strong>
                                <p style="font-size: 0.8rem; color: var(--slate-500); margin-top: 0.15rem;">
                                    Accessible only to logged-in students and faculty of Anurag University.
                                </p>
                            </div>
                        </label>

                        <label style="display: flex; align-items: flex-start; gap: 0.65rem; cursor: pointer;">
                            <input type="radio" name="profileVisibility" value="PRIVATE"
                                   th:checked="${student.profileVisibility.name() == 'PRIVATE'}" style="margin-top: 0.25rem;">
                            <div>
                                <strong style="color: var(--slate-800);">Private</strong>
                                <p style="font-size: 0.8rem; color: var(--slate-500); margin-top: 0.15rem;">
                                    Hidden from public view and search engines. Accessible only to you and departmental verifiers.
                                </p>
                            </div>
                        </label>
                    </div>
                </div>

                <div style="margin-top: 1.75rem;">
                    <button type="submit" class="btn btn-primary" style="padding: 0.75rem 1.5rem;">
                        Save Preferences
                    </button>
                </div>
            </form>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
